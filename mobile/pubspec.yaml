name: mobile
description: H10 Mobile Patient Rehabilitation Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  h10_core:
    path: packages/h10_core
  web_socket_channel: ^3.0.1
  http: ^1.2.2
  intl: ^0.19.0
  webview_flutter: ^4.10.0
  webview_flutter_web: ^0.2.3+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/hand/
