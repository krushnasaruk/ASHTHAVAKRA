; PlatformIO Project Configuration File for RehabBridge NEXUS / H10 ESP32-S3 Firmware
; Target: ESP32-S3 DevKit with ADS1115 ADC and MPU6050 IMU

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
upload_speed = 921600

lib_deps =
    adafruit/Adafruit ADS1X15 @ ^2.4.2
    electroniccats/MPU6050 @ ^1.3.1
    bblanchon/ArduinoJson @ ^7.2.1

build_flags =
    -DSERIAL_BAUD=921600
    -DFIRMWARE_VERSION=\"1.0.0\"
    -DDEFAULT_PROFILE=\"demo3\"
    -DCORE_DEBUG_LEVEL=0
